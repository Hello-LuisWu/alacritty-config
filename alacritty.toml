# version: 0.16.1

[general]
import = [
    "~/.config/alacritty/config/theme.toml",         # 配置颜色主题
    "~/.config/alacritty/config/keymap.toml",        # 导入快捷键配置
    "~/.config/alacritty/config/env.toml",           # 配置环境变量
    "~/.config/alacritty/config/terminal.toml",      # 终端配置
    "~/.config/alacritty/config/font.toml",          # 字体配置
    "~/.config/alacritty/config/scrolling.toml",     #
    "~/.config/alacritty/config/window.toml",        # 窗口配置
    "~/.config/alacritty/config/selection.toml",     # 划词配置
    "~/.config/alacritty/config/cursor.toml",        # 光标配置
    "~/.config/alacritty/config/mouse.toml",         # 鼠标配置
    "~/.config/alacritty/config/bell.toml",          # 提示音配置
    "~/.config/alacritty/config/hints.toml",         # hints 配置
    "~/.config/alacritty/config/debug.toml",         # debug 配置
]
working_directory  = "None"
live_config_reload = true  # 保存是自动加载配置文件
ipc_socket         = true # 是否开启通知消息 (unix only)
